spring:
  application:
    name: eureka-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    config:
      label: ${SPRING_CLOUD_CONFIG_LABEL:develop}
      fail-fast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:false}

# config-server fetch 실패 시에도 standalone 으로 안전 부팅하도록 fallback 명시.
# (정상 경로는 config-repo/eureka-server/eureka-server.yaml 의 동일 설정.)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
